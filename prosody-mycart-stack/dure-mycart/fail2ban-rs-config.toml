# fail2ban-rs configuration for dure-mycart + XMPP stack
# Version: 1.5.3+ format

[global]
ban_count_decay = "30d"  # Reset escalation count after 30 quiet days
state_file = "/var/lib/fail2ban-rs/state.bin"
socket_path = "/var/run/fail2ban-rs/fail2ban-rs.sock"

# MaxMind GeoIP databases (optional)
# maxmind_asn = "/maxmind/GeoLite2-ASN.mmdb"
# maxmind_country = "/maxmind/GeoLite2-Country.mmdb"
# maxmind_city = "/maxmind/GeoLite2-City.mmdb"

# [logging]
# level = "info"
# format = "logfmt"

# Monitor XMPP authentication failures
[jail.xmpp-auth]
enabled = true
log_path = "/logs/prosody/prosody.log"
date_format = "syslog"
filter = [
    # Match Prosody auth failures from mod_log_auth
    'Failed authentication attempt .* from IP: <HOST>',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
# maxmind = ["asn", "country"]  # Enable GeoIP logging (requires databases)

# Monitor mycart authentication failures
[jail.mycart-auth]
enabled = true
log_path = "/logs/mycart-stderr.log"
date_format = "iso8601"
filter = [
    # Match auth failures logged by handlers/private/auth.go
    '"level":"warn".*"ip":"<HOST>".*"message":"authentication failed',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true

# Monitor xmpp-proxy C2S connection failures
[jail.xmpp-proxy-c2s]
enabled = true
log_path = "/logs/xmpp-proxy-stdout.log"
date_format = "iso8601"
filter = [
    # Match TLS/connection errors with IPv4-mapped IPv6 format [::ffff:IP]:port
    '\[ERROR[^\]]*\] [^:]+: \(\[::(ffff:)?<HOST>\]:[0-9]+.*\) (peer is incompatible|not enough bytes|stream ended)',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true

# Monitor xmpp-proxy S2S connection failures
[jail.xmpp-proxy-s2s]
enabled = true
log_path = "/logs/xmpp-proxy-stdout.log"
date_format = "iso8601"
filter = [
    # Match S2S TLS/connection errors with IPv4-mapped IPv6 format
    '\[ERROR[^\]]*\] [^:]+: \(\[::(ffff:)?<HOST>\]:[0-9]+.*(s2s|->).*\) (peer is incompatible|not enough bytes|stream ended)',
]
max_retry = 7  # Reduced from 10 for faster S2S abuse blocking
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
