# fail2ban-rs configuration for dure-mycart + XMPP stack
# Version: 1.5.3+ format

[global]
ban_count_decay = "30d"  # Reset escalation count after 30 quiet days
state_file = "/var/lib/fail2ban-rs/state.bin"
socket_path = "/var/run/fail2ban-rs/fail2ban-rs.sock"

# MaxMind GeoIP databases (optional)
# maxmind_asn = "/maxmind/GeoLite2-ASN.mmdb"
# maxmind_country = "/maxmind/GeoLite2-Country.mmdb"
# maxmind_city = "/maxmind/GeoLite2-City.mmdb"

# [logging]
# level = "info"
# format = "logfmt"

# Monitor XMPP authentication failures
[jail.xmpp-auth]
enabled = true
log_path = "/logs/prosody/prosody.log"
date_format = "syslog"
filter = [
    # Match Prosody auth failures from mod_log_auth
    'Failed authentication attempt .* from IP: <HOST>',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
# maxmind = ["asn", "country"]  # Enable GeoIP logging (requires databases)

# Monitor mycart authentication failures
[jail.mycart-auth]
enabled = true
log_path = "/logs/mycart-stderr.log"
date_format = "iso8601"
filter = [
    # Match mycart auth failures - adjust regex based on actual log format
    '"level":"warn".*"status":401.*"ip":"<HOST>"',
    '"level":"error".*authentication.*"ip":"<HOST>"',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true

# Monitor xmpp-proxy C2S connection failures
[jail.xmpp-proxy-c2s]
enabled = true
log_path = "/logs/xmpp-proxy-stderr.log"
date_format = "iso8601"
filter = [
    # Match C2S authentication failures - adjust based on xmpp-proxy log format
    'c2s.*auth.*failed.*<HOST>',
    'c2s.*connection.*rejected.*<HOST>',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true

# Monitor xmpp-proxy S2S connection failures
[jail.xmpp-proxy-s2s]
enabled = true
log_path = "/logs/xmpp-proxy-stderr.log"
date_format = "iso8601"
filter = [
    # Match S2S connection failures - adjust based on xmpp-proxy log format
    's2s.*connection.*failed.*<HOST>',
    's2s.*rejected.*<HOST>',
]
max_retry = 10
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
