command = "/usr/local/bin/xmpp-proxy-wrapper.sh"
start-delay = "5s"
start-after = ["mycart"]
working-directory = "/app"
stdout = "/logs/xmpp-proxy-stdout.log"
stderr = "/logs/xmpp-proxy-stderr.log"

[restart]
strategy = "always"
backoff = "10s"
attempts = 0

[environment]
RUST_LOG = "info"

[termination]
signal = "TERM"
wait = "5s"
