# dure-mycart + XMPP Docker Compose (Production)
# Merged stack: dure-mycart + xmpp-proxy + fail2ban-rs in single container
# prosody runs separately on bridge network
# For development builds, use docker-compose.dev.yml

services:
  # Init service to set up Prosody community modules
  prosody-modules-init:
    image: alpine:latest
    container_name: prosody-modules-init
    restart: "no"
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: >
      sh -c '
        echo "=== Prosody Modules Initialization ===" &&
        if [ -f prosody-modules/mod_admin_web2/admin_web2/mod_admin_web2.lua ] && [ -f prosody-modules/mod_admin_web2/admin_web2/www_files/js/strophe.min.js ]; then
          echo "✓ prosody-modules already initialized" &&
          exit 0
        fi &&
        echo "Installing mercurial..." &&
        apk add --no-cache mercurial &&
        echo "Cloning prosody-modules repository..." &&
        rm -rf prosody-modules &&
        hg clone https://hg.prosody.im/prosody-modules prosody-modules &&
        echo "✓ Modules cloned successfully" &&
        echo "Fetching admin_web2 vendored JS/CSS dependencies..." &&
        (cd prosody-modules/mod_admin_web2/admin_web2 && sh get_deps.sh) &&
        echo "✓ admin_web2 dependencies fetched" &&
        ls -la prosody-modules/ | head -20
      '

  # Renders prosody config template with XMPP_DOMAIN substitution
  prosody-config-init:
    image: alpine:latest
    container_name: prosody-config-init
    restart: "no"
    working_dir: /workspace
    env_file: .env
    volumes:
      - ../:/workspace
    command: sh prosody-mycart-stack/render-prosody-config.sh

  # Fix permissions for Prosody data directories
  prosody-permissions-init:
    image: alpine:latest
    container_name: prosody-permissions-init
    restart: "no"
    user: root
    volumes:
      - ${DATA_DIR:-/srv/data}/prosody:/data/prosody
      - ${DATA_DIR:-/srv/data}/logs/prosody:/data/logs
      - ${DATA_DIR:-/srv/data}/certs:/data/certs
    command: >
      sh -c '
        echo "=== Fixing Prosody directory permissions ===" &&
        chown -R 1000:1000 /data/prosody /data/logs /data/certs &&
        chmod -R 775 /data/prosody /data/logs &&
        chmod -R 755 /data/certs &&
        echo "✓ Permissions fixed (UID 1000:1000)" &&
        ls -la /data/logs
      '
    depends_on:
      prosody-config-init:
        condition: service_completed_successfully

  # Prosody XMPP server
  prosody:
    image: prosodyim/prosody:13.0
    container_name: prosody
    restart: unless-stopped
    env_file: .env
    environment:
      PROSODY_ADMINS: ${XMPP_ADMIN:-admin@${XMPP_DOMAIN}}
      PROSODY_VIRTUAL_HOSTS: ${XMPP_DOMAIN}
      PROSODY_LOGLEVEL: ${PROSODY_LOGLEVEL:-info}
      PROSODY_STORAGE: internal
      PROSODY_ENABLE_MODULES: mam,carbons,csi_simple,ping,admin_adhoc,admin_shell,http,admin_web2,bosh,websocket
      PROSODY_CERTIFICATES: /certs
      PROSODY_RETENTION_DAYS: ${PROSODY_RETENTION_DAYS:-90}
    ports:
      - "5269:5269"  # S2S federation (standard port for legacy servers)
    volumes:
      - ${DATA_DIR:-/srv/data}/prosody:/var/lib/prosody
      - ${DATA_DIR:-/srv/data}/certs:/certs:ro
      - ${DATA_DIR:-/srv/data}/logs/prosody:/var/log/prosody
      - ../generated/proxy.cfg.lua:/etc/prosody/conf.d/proxy.cfg.lua:ro
      - ../prosody-modules:/usr/lib/prosody/community:ro
    networks:
      xmpp-internal:
        ipv4_address: 172.19.0.2  # Static IP required for xmpp-proxy config
    healthcheck:
      test: ["CMD", "prosodyctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      prosody-modules-init:
        condition: service_completed_successfully
      prosody-config-init:
        condition: service_completed_successfully
      prosody-permissions-init:
        condition: service_completed_successfully

  # Merged stack: dure-mycart + Prosody + fail2ban-rs
  # Production: pulls pre-built image from GitHub Container Registry
  prosody-mycart-stack:
    image: ghcr.io/dure-one/prosody-mycart:latest
    container_name: prosody-mycart-stack
    restart: unless-stopped
    # Bridge network allows direct container communication, preserving PROXY headers
    ports:
      - "80:80"       # HTTP (ACME challenge)
      - "443:443"     # HTTPS + XMPP ALPN (C2S/S2S multiplexed)
    cap_add:
      - NET_ADMIN
    env_file: .env
    volumes:
      - ${DATA_DIR:-/srv/data}/certs:/certs
      - ${DATA_DIR:-/srv/data}/logs:/logs
      - ${DATA_DIR:-/srv/data}/fail2ban:/var/lib/fail2ban-rs
      - ${DATA_DIR:-/srv/data}/mycart/lc_base:/app/lc_base
      - ${DATA_DIR:-/srv/data}/mycart/lc_uploads:/app/lc_uploads
      - ${DATA_DIR:-/srv/data}/mycart/lc_digitals:/app/lc_digitals
    networks:
      - xmpp-internal
    depends_on:
      prosody:
        condition: service_healthy

networks:
  xmpp-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
