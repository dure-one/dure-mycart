            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Purchases of the signed-in customer
      tags:
      - Account
  /api/customer/purchases/{file_id}/download:
    get:
      description: Stream a product digital file as an attachment, if the cabinet
        session's address has paid for the product
      parameters:
      - description: Digital file ID
        in: path
        name: file_id
        required: true
        type: string
      responses:
        "200":
          description: File content
          schema:
            type: file
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: The cabinet is disabled, or the file is not one this customer
            bought
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Download a purchased digital file
      tags:
      - Account
  /api/customer/signin:
    post:
      consumes:
      - application/json
      description: Authenticate a customer and set the session cookie
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.SignIn'
      produces:
      - application/json
      responses:
        "200":
          description: Signed in
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Wrong credentials or validation error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: The cabinet is disabled
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Sign in to the cabinet
      tags:
      - Account
  /api/customer/signout:
    post:
      description: Delete the current session row and clear the cabinet cookie
      responses:
        "204":
          description: Session invalidated
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: The cabinet is disabled
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Sign out of the cabinet
      tags:
      - Account
  /api/customer/signup:
    post:
      consumes:
      - application/json
      description: Register a customer account for the cabinet. Available only while
        the cabinet is enabled.
      parameters:
      - description: Account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.CustomerSignUp'
      produces:
      - application/json
      responses:
        "200":
          description: Account created
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Validation error or address already registered
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: The cabinet is disabled
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Create a storefront account
      tags:
      - Account
  /api/install:
    post:
      consumes:
      - application/json
      description: Perform initial setup with admin credentials and domain
      parameters:
      - description: Installation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Install'
      produces:
      - application/json
      responses:
        "200":
          description: Cart installed
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Install application
      tags:
      - Install
  /api/install/db/test:
    post:
      consumes:
      - application/json
      description: Connects to the selected database and reports what was found
      parameters:
      - description: Database to test
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_private.installDatabaseTest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_handlers_private.installDatabaseTestResult'
              type: object
        "400":
          description: Connection failed
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Test database connection
      tags:
      - Install
  /api/install/status:
    get:
      description: Returns whether the cart has been installed
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_handlers_private.installStatus'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Installation status
      tags:
      - Install
  /api/pages/{page_slug}:
    get:
      description: Get an active page by its URL slug
      parameters:
      - description: Page slug
        in: path
        name: page_slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Page content
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Page'
              type: object
        "404":
          description: Page not found
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Get page by slug
      tags:
      - Public
  /api/payment/portone/complete:
    post:
      consumes:
      - application/json
      description: Verify payment with PortOne API and update cart status
      parameters:
      - description: Payment completion request
        in: body
        name: request
        required: true
        schema:
          properties:
            cart_id:
              type: string
            payment_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Payment verified
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Complete PortOne payment
      tags:
      - Cart
  /api/payment/portone/webhook:
    post:
      consumes:
      - application/json
      description: Handle PortOne webhook notifications for payment events
      parameters:
      - description: Webhook signature
        in: header
        name: PortOne-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: PortOne webhook
      tags:
      - Cart
  /api/products:
    get:
      description: Get paginated list of active products visible to customers
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Products list
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Products'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: List active products
      tags:
      - Public
  /api/products/{product_slug}:
    get:
      description: Get a single active product by its slug
      parameters:
      - description: Product slug
        in: path
        name: product_slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product details
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Product'
              type: object
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Get active product
      tags:
      - Public
  /api/sellerinfo:
    get:
      description: Get Korean seller information (requires captcha verification)
      parameters:
      - description: Access token from captcha verification
        in: header
        name: X-Access-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Seller information
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: Seller info not enabled
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Get seller info
      tags:
      - Public
  /api/sellerinfo/captcha:
    get:
      description: Generate rotate captcha for seller info access
      produces:
      - application/json
      responses:
        "200":
          description: Captcha data
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Generate captcha
      tags:
      - Public
  /api/sellerinfo/verify:
    post:
      consumes:
      - application/json
      description: Verify rotate captcha answer and issue access token
      parameters:
      - description: Captcha verification data
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Verification result
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Verify captcha
      tags:
      - Public
  /api/settings:
    get:
      description: Get site name, domain, currency, social links, and published pages
      produces:
      - application/json
      responses:
        "200":
          description: Public settings
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Get public settings
      tags:
      - Public
  /api/sign/in:
    post:
      consumes:
      - application/json
      description: Authenticate admin user with email and password, returns JWT token
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.SignIn'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  type: string
              type: object
        "400":
          description: Invalid credentials or validation error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Sign in
      tags:
      - Auth
  /api/sign/out:
    post:
      description: Invalidate current session and clear token cookie
      responses:
        "204":
          description: Session invalidated
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Sign out
      tags:
      - Auth
  /cart/payment:
    post:
      consumes:
      - application/json
      description: Create a payment session and return a redirect URL for the selected
        provider
      parameters:
      - description: Payment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.CartPayment'
      produces:
      - application/json
      responses:
        "200":
          description: Payment URL
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Validation error or dummy provider for paid cart
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Initiate payment
      tags:
      - Cart
  /cart/payment/callback:
    post:
      consumes:
      - application/json
      description: Webhook endpoint for payment providers to report status changes
      parameters:
      - description: Cart ID
        in: query
        name: cart_id
        required: true
        type: string
      - description: Payment system
        in: query
        name: payment_system
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: '*ok*'
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Payment callback
      tags:
      - Cart
  /cart/payment/cancel:
    get:
      description: Handle canceled payment, update cart status, and redirect to SPA
      parameters:
      - description: Cart ID
        in: query
        name: cart_id
        type: string
      - description: Payment system
        in: query
        name: payment_system
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to cancel page
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Payment cancel
      tags:
      - Cart
  /cart/payment/success:
    get:
      description: Handle successful payment redirect, verify with provider, and update
        cart
      parameters:
      - description: Cart ID
        in: query
        name: cart_id
        required: true
        type: string
      - description: Payment system
        in: query
        name: payment_system
        required: true
        type: string
      - description: Stripe session ID
        in: query
        name: session
        type: string
      - description: PayPal token
        in: query
        name: token
        type: string
      - description: Coinbase charge ID
        in: query
        name: charge_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Passes to SPA handler
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Payment success
      tags:
      - Cart
  /ping:
    get:
      description: Returns pong for liveness probes
      produces:
      - application/json
      responses:
        "200":
          description: Pong
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Health check
      tags:
      - Public
  /products/{slug}.png:
    get:
      description: Serves the first/representative product image, converted to PNG
        format
      parameters:
      - description: Product slug (without .png extension)
        in: path
        name: slug
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: Product image in PNG format
          schema:
            type: file
        "404":
          description: Product or image not found
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      summary: Get product representative image
      tags:
      - Public
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
