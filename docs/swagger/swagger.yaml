        type: integer
      total_rows:
        type: integer
      updated:
        type: integer
    type: object
  github_com_shurco_mycart_pkg_litepay.PaymentSystem:
    enum:
    - stripe
    - paypal
    - spectrocoin
    - coinbase
    - dummy
    type: string
    x-enum-comments:
      COINBASE: Coinbase Commerce cryptocurrency payment provider
      DUMMY: Dummy provider for testing (always succeeds, only for free items)
      PAYPAL: PayPal payment provider
      SPECTROCOIN: SpectroCoin cryptocurrency payment provider
      STRIPE: Stripe payment provider (credit/debit cards)
    x-enum-descriptions:
    - Stripe payment provider (credit/debit cards)
    - PayPal payment provider
    - SpectroCoin cryptocurrency payment provider
    - Coinbase Commerce cryptocurrency payment provider
    - Dummy provider for testing (always succeeds, only for free items)
    x-enum-varnames:
    - STRIPE
    - PAYPAL
    - SPECTROCOIN
    - COINBASE
    - DUMMY
  github_com_shurco_mycart_pkg_webutil.HTTPResponse:
    properties:
      message:
        type: string
      result: {}
      success:
        type: boolean
    type: object
  internal_handlers_private.installStatus:
    properties:
      installed:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@mycart.com
    name: API Support
    url: https://github.com/shurco/mycart/issues
  description: Open source shopping-cart backend API - a single-binary e-commerce
    solution
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/shurco/mycart
  title: myCart API
  version: "1.0"
paths:
  /api/_/carts:
    get:
      description: Get paginated list of all carts
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Carts list with pagination
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: List carts
      tags:
      - Carts
  /api/_/carts/{cart_id}:
    get:
      description: Get detailed cart information including product items
      parameters:
      - description: Cart ID
        in: path
        name: cart_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cart details
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Missing cart_id
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "404":
          description: Cart not found
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Get cart
      tags:
      - Carts
  /api/_/carts/{cart_id}/mail:
    post:
      description: Re-send purchase confirmation email for a cart
      parameters:
      - description: Cart ID
        in: path
        name: cart_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email sent
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Send cart email
      tags:
      - Carts
  /api/_/pages:
    get:
      description: Get paginated list of all pages (including inactive)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pages list with pagination
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: List pages
      tags:
      - Pages
    post:
      consumes:
      - application/json
      description: Create a new page with name, slug, and optional content
      parameters:
      - description: Page data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_shurco_mycart_internal_models.Page'
      produces:
      - application/json
      responses:
        "200":
          description: Created page
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Page'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Create page
      tags:
      - Pages
  /api/_/pages/{page_id}:
    delete:
      description: Delete a page by its ID
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Page deleted
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Delete page
      tags:
      - Pages
    get:
      description: Get a single page by its ID
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Page details
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Page'
              type: object
        "404":
          description: Page not found
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Get page
      tags:
      - Pages
    patch:
      consumes:
      - application/json
      description: Update page metadata (name, slug, position, SEO)
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
      - description: Page data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_shurco_mycart_internal_models.Page'
      produces:
      - application/json
      responses:
        "200":
          description: Page updated
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Update page
      tags:
      - Pages
  /api/_/pages/{page_id}/active:
    patch:
      description: Toggle the active/inactive status of a page
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Updated page
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Page'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Toggle page active
      tags:
      - Pages
  /api/_/pages/{page_id}/content:
    patch:
      consumes:
      - application/json
      description: Update only the HTML content of a page
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
      - description: Content
        in: body
        name: request
        required: true
        schema:
          properties:
            content:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Content updated
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Update page content
      tags:
      - Pages
  /api/_/products:
    get:
      description: Get paginated list of all products (including inactive)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Products list
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Products'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: List products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create a new product with name, slug, price, and digital type
      parameters:
      - description: Product data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_shurco_mycart_internal_models.Product'
      produces:
      - application/json
      responses:
        "200":
          description: Created product
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Product'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Create product
      tags:
      - Products
  /api/_/products/{product_id}:
    delete:
      description: Delete a product by its ID
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product deleted
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Delete product
      tags:
      - Products
    get:
      description: Get a single product by its ID (including inactive)
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product details
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Product'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Get product
      tags:
      - Products
    patch:
      consumes:
      - application/json
      description: Update product metadata and return the updated product
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Product data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_shurco_mycart_internal_models.Product'
      produces:
      - application/json
      responses:
        "200":
          description: Updated product
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Product'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - Products
  /api/_/products/{product_id}/active:
    patch:
      description: Toggle the active/inactive status of a product
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product active updated
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Toggle product active
      tags:
      - Products
  /api/_/products/{product_id}/digital:
    get:
      description: Get digital files or license keys for a product
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Digital content
          schema:
            allOf:
            - $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_shurco_mycart_internal_models.Digital'
              type: object
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Get product digital content
      tags:
      - Products
    post:
      consumes:
      - multipart/form-data
      description: Upload a digital file or create a license key entry
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Digital file
        in: formData
        name: document
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Digital content added
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Add product digital content
      tags:
      - Products
  /api/_/products/{product_id}/digital/{digital_id}:
    delete:
      description: Delete a digital content entry by product and digital ID
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Digital ID
        in: path
        name: digital_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Digital content deleted
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shurco_mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Delete product digital content
      tags:
      - Products
    patch:
      consumes:
      - application/json
      description: Update the content of a digital data entry (license key)
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
