basePath: /
definitions:
  github_com_dure-one_dure-mycart_internal_models.Branding:
    properties:
      favicon:
        type: string
      logo:
        description: |-
          The three fields are always sent, empty strings included. A group that
          dropped its empty members would answer a shop with a blank tagline with
          {}, and a client binding a field to that gets undefined rather than a
          string — which is a crash, not an empty field.
        type: string
      tagline:
        description: |-
          Tagline is printed beside the logo. Empty leaves the header with the mark
          alone, which is how a shop that has uploaded nothing is drawn.
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Cart:
    properties:
      amount_total:
        type: integer
      cart:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.CartProduct'
        type: array
      created:
        type: integer
      currency:
        type: string
      email:
        type: string
      id:
        type: string
      payment_id:
        type: string
      payment_status:
        $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_litepay.Status'
      payment_system:
        $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_litepay.PaymentSystem'
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.CartPayment:
    properties:
      email:
        type: string
      products:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.CartProduct'
        type: array
      provider:
        $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_litepay.PaymentSystem'
    type: object
  github_com_dure-one_dure-mycart_internal_models.CartProduct:
    properties:
      id:
        type: string
      quantity:
        type: integer
      unit_price:
        description: Expected price from client for validation
        type: integer
      variant_id:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Customer:
    properties:
      active:
        type: boolean
      created:
        type: integer
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.CustomerSignUp:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.CustomerSummary:
    properties:
      active:
        type: boolean
      created:
        type: integer
      currency:
        type: string
      email:
        type: string
      id:
        type: string
      last_order:
        type: integer
      name:
        type: string
      purchases:
        type: integer
      registered:
        type: boolean
      spent:
        type: integer
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.Data:
    properties:
      cart_id:
        type: string
      content:
        type: string
      id:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.DatabaseChoice:
    properties:
      driver:
        type: string
      dsn:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Digital:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Data'
        type: array
      files:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.File'
        type: array
      filled:
        type: boolean
      type:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.File:
    properties:
      ext:
        type: string
      id:
        type: string
      is_representative:
        type: boolean
      name:
        type: string
      orig_name:
        type: string
      position:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.Install:
    properties:
      database:
        allOf:
        - $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.DatabaseChoice'
        description: |-
          Database is the optional database selection from the install wizard.
          Absent means "keep the database the process is already configured for",
          which is what every installation did before PostgreSQL support existed.
      domain:
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Message:
    properties:
      channel:
        description: sms, xmpp
        type: string
      contact_id:
        type: string
      content:
        type: string
      created:
        type: integer
      delivery_status:
        description: pending, delivered, failed
        type: string
      direction:
        description: inbound, outbound
        type: string
      id:
        type: string
      read_status:
        type: boolean
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.MessageCreate:
    properties:
      channel:
        type: string
      contact_address:
        type: string
      contact_type:
        type: string
      content:
        type: string
      delivery_status:
        type: string
      direction:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Metadata:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Page:
    properties:
      active:
        type: boolean
      content:
        type: string
      created:
        type: integer
      id:
        type: string
      name:
        type: string
      position:
        type: string
      seo:
        $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Seo'
      slug:
        type: string
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.Product:
    properties:
      active:
        type: boolean
      amount:
        type: integer
      attributes:
        items:
          type: string
        type: array
      brief:
        type: string
      created:
        type: integer
      description:
        type: string
      digital:
        $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Digital'
      has_variants:
        description: NEW
        type: boolean
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.File'
        type: array
      metadata:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Metadata'
        type: array
      name:
        type: string
      options:
        description: NEW
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.ProductOption'
        type: array
      quantity:
        description: NEW
        type: integer
      seo:
        $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Seo'
      sku:
        description: NEW
        type: string
      slug:
        type: string
      updated:
        type: integer
      variants:
        description: NEW
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.ProductVariant'
        type: array
    type: object
  github_com_dure-one_dure-mycart_internal_models.ProductOption:
    properties:
      created:
        type: integer
      id:
        type: string
      name:
        type: string
      position:
        type: integer
      product_id:
        type: string
      values:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.ProductOptionValue'
        type: array
    type: object
  github_com_dure-one_dure-mycart_internal_models.ProductOptionValue:
    properties:
      id:
        type: string
      option_id:
        type: string
      position:
        type: integer
      value:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.ProductVariant:
    properties:
      active:
        type: boolean
      created:
        type: integer
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.File'
        type: array
      option_values:
        additionalProperties:
          type: string
        description: '{"Size": "Medium", "Color": "Black"}'
        type: object
      price_surcharge:
        description: cents
        type: integer
      product_id:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.Products:
    properties:
      currency:
        type: string
      products:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Product'
        type: array
      total:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_internal_models.ResponderSettings:
    properties:
      xmpp_jid:
        type: string
      xmpp_password:
        type: string
      xmpp_port:
        type: integer
      xmpp_server:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Seo:
    properties:
      description:
        type: string
      keywords:
        type: string
      title:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.SignIn:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_dure-one_dure-mycart_internal_models.Workflow:
    properties:
      author:
        type: string
      content:
        description: mermaid markdown
        type: string
      created:
        type: integer
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      tags:
        description: JSON array
        type: string
      updated:
        type: integer
      version:
        type: string
    type: object
  github_com_dure-one_dure-mycart_pkg_csvimport.Error:
    properties:
      line:
        type: integer
      message:
        type: string
    type: object
  github_com_dure-one_dure-mycart_pkg_csvimport.ImportResult:
    properties:
      errors:
        items:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_csvimport.Error'
        type: array
      imported:
        type: integer
      skipped:
        type: integer
      to_add:
        description: Preview only
        type: integer
      to_update:
        description: Preview only
        type: integer
      total_rows:
        type: integer
      updated:
        type: integer
    type: object
  github_com_dure-one_dure-mycart_pkg_litepay.PaymentSystem:
    enum:
    - stripe
    - paypal
    - spectrocoin
    - coinbase
    - dummy
    type: string
    x-enum-comments:
      COINBASE: Coinbase Commerce cryptocurrency payment provider
      DUMMY: Dummy provider for testing (always succeeds, only for free items)
      PAYPAL: PayPal payment provider
      SPECTROCOIN: SpectroCoin cryptocurrency payment provider
      STRIPE: Stripe payment provider (credit/debit cards)
    x-enum-descriptions:
    - Stripe payment provider (credit/debit cards)
    - PayPal payment provider
    - SpectroCoin cryptocurrency payment provider
    - Coinbase Commerce cryptocurrency payment provider
    - Dummy provider for testing (always succeeds, only for free items)
    x-enum-varnames:
    - STRIPE
    - PAYPAL
    - SPECTROCOIN
    - COINBASE
    - DUMMY
  github_com_dure-one_dure-mycart_pkg_litepay.Status:
    enum:
    - new
    - unpaid
    - paid
    - canceled
    - failed
    - processed
    - test
    type: string
    x-enum-comments:
      CANCELED: Payment has been canceled (final)
      FAILED: Payment has failed (final)
      NEW: Payment has been created
      PAID: Payment has been successfully completed (final)
      PROCESSED: Payment is being processed
      TEST: Test payment
      UNPAID: Payment is awaiting payment
    x-enum-descriptions:
    - Payment has been created
    - Payment is awaiting payment
    - Payment has been successfully completed (final)
    - Payment has been canceled (final)
    - Payment has failed (final)
    - Payment is being processed
    - Test payment
    x-enum-varnames:
    - NEW
    - UNPAID
    - PAID
    - CANCELED
    - FAILED
    - PROCESSED
    - TEST
  github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse:
    properties:
      message:
        type: string
      result: {}
      success:
        type: boolean
    type: object
  internal_handlers_private.installDatabase:
    properties:
      driver:
        type: string
      dsn:
        type: string
      locked:
        type: boolean
      source:
        type: string
    type: object
  internal_handlers_private.installDatabaseTest:
    properties:
      driver:
        type: string
      dsn:
        type: string
    type: object
  internal_handlers_private.installDatabaseTestResult:
    properties:
      driver:
        type: string
      has_existing_schema:
        type: boolean
      ok:
        type: boolean
      server_version:
        type: string
    type: object
  internal_handlers_private.installStatus:
    properties:
      database:
        $ref: '#/definitions/internal_handlers_private.installDatabase'
      installed:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/dure-one/dure-mycart/issues
  description: Open source shopping-cart backend API - a single-binary e-commerce
    solution
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/dure-one/dure-mycart
  title: myCart API
  version: "1.0"
paths:
  /api/_/carts:
    get:
      description: Get paginated list of all carts
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Carts list with pagination
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: List carts
      tags:
      - Carts
  /api/_/carts/{cart_id}:
    get:
      description: Get detailed cart information including product items
      parameters:
      - description: Cart ID
        in: path
        name: cart_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cart details
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "400":
          description: Missing cart_id
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: Cart not found
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Get cart
      tags:
      - Carts
  /api/_/carts/{cart_id}/mail:
    post:
      description: Re-send purchase confirmation email for a cart
      parameters:
      - description: Cart ID
        in: path
        name: cart_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email sent
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Send cart email
      tags:
      - Carts
  /api/_/customers:
    get:
      description: 'Get a paginated list of the shop''s customers: registered accounts
        and everyone who has paid, one row per address'
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Match a substring of the email address or name
        in: query
        name: search
        type: string
      - description: Only customers with an account
        in: query
        name: registered
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Customers list with pagination
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.CustomerSummary'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - Customers
  /api/_/customers/{customer_id}:
    delete:
      description: Delete a customer account and end its sessions; the carts stay
        as the record of what was paid
      parameters:
      - description: Customer ID
        in: path
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Customer deleted
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Delete customer
      tags:
      - Customers
  /api/_/customers/{customer_id}/active:
    patch:
      description: Toggle the active status of a customer account; blocking also ends
        every session the customer has open
      parameters:
      - description: Customer ID
        in: path
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Updated customer
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Customer'
              type: object
        "404":
          description: Customer not found
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Toggle customer active
      tags:
      - Customers
  /api/_/customers/{customer_id}/password:
    patch:
      description: Generate a new password for a customer account and return it once;
        every session the customer has open is ended
      parameters:
      - description: Customer ID
        in: path
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: New password
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "404":
          description: Customer not found
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Reset customer password
      tags:
      - Customers
  /api/_/customers/carts:
    get:
      description: Get every cart created for an email address, newest first, in any
        payment state
      parameters:
      - description: Customer email address
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Customer carts
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Cart'
                  type: array
              type: object
        "400":
          description: Missing email
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Get customer carts
      tags:
      - Customers
  /api/_/pages:
    get:
      description: Get paginated list of all pages (including inactive)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pages list with pagination
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: List pages
      tags:
      - Pages
    post:
      consumes:
      - application/json
      description: Create a new page with name, slug, and optional content
      parameters:
      - description: Page data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Page'
      produces:
      - application/json
      responses:
        "200":
          description: Created page
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_dure-one_dure-mycart_internal_models.Page'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Create page
      tags:
      - Pages
  /api/_/pages/{page_id}:
    delete:
      description: Delete a page by its ID
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Page deleted
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dure-one_dure-mycart_pkg_webutil.HTTPResponse'
      security:
      - BearerAuth: []
      summary: Delete page
      tags:
      - Pages
    get:
      description: Get a single page by its ID
      parameters:
      - description: Page ID
        in: path
        name: page_id
        required: true
        type: string
