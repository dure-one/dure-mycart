# Docker Compose configuration for myCart with SQLite or PostgreSQL
#
# Usage:
#   SQLite:     docker-compose -f docker-compose.unified.yml up
#   PostgreSQL: DB_TYPE=postgres docker-compose -f docker-compose.unified.yml --profile postgres up
#
# Or copy to docker-compose.yml and customize

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mycart-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mycart}
      - POSTGRES_USER=${POSTGRES_USER:-mycart}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mycart_network
    profiles:
      - postgres  # Only start when postgres profile is active

  mycart:
    image: mycart:latest
    container_name: mycart
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false  # Optional dependency
    ports:
      - "${MYCART_PORT:-8080}:8080"
    environment:
      # Database Configuration
      - DB_TYPE=${DB_TYPE:-sqlite}

      # SQLite Configuration (used when DB_TYPE=sqlite)
      - SQLITE_PATH=${SQLITE_PATH:-/data/mycart.db}

      # PostgreSQL Configuration (used when DB_TYPE=postgres)
      # Option 1: Connection string (recommended)
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-mycart}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mycart}?sslmode=disable}

      # Option 2: Individual parameters (fallback)
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB:-mycart}
      - DB_USER=${POSTGRES_USER:-mycart}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      # PostgreSQL Connection Pooling
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-300}

    volumes:
      # SQLite data directory
      - ./lc_base:/data
      # Upload directories
      - ./lc_uploads:/app/lc_uploads
      - ./lc_digitals:/app/lc_digitals
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mycart_network

volumes:
  postgres_data:
    driver: local

networks:
  mycart_network:
    driver: bridge
