command = "/usr/local/bin/xmpp-proxy /etc/xmpp-proxy/config.toml"
start-delay = "10s"
start-after = ["mycart.toml"]
stdout = "/logs/xmpp-proxy-stdout.log"
stderr = "/logs/xmpp-proxy-stderr.log"

[restart]
strategy = "always"
backoff = "10s"
attempts = 0

[environment]
RUST_LOG = "info"

[termination]
signal = "TERM"
wait = "15s"
