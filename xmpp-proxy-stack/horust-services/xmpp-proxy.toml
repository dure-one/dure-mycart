command = "/usr/local/bin/xmpp-proxy-wrapper.sh"
start-delay = "5s"
start-after = ["mycart.toml"]
working-directory = "/etc/xmpp-proxy"
stdout = "/logs/xmpp-proxy-stdout.log"
stderr = "/logs/xmpp-proxy-stderr.log"

[restart]
strategy = "always"
backoff = "10s"
attempts = 0

[environment]
RUST_LOG = "info"
# XMPP_DOMAIN inherited from Docker container environment

[termination]
signal = "TERM"
wait = "15s"
