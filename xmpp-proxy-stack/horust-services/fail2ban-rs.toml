command = "/usr/local/bin/fail2ban-rs run --config /etc/fail2ban-rs/config.toml"
start-delay = "3s"
start-after = ["xmpp-proxy.toml"]
working-directory = "/var/lib/fail2ban-rs"
stdout = "/logs/fail2ban-rs-stdout.log"
stderr = "/logs/fail2ban-rs-stderr.log"
user = "root"

[restart]
strategy = "always"
backoff = "10s"
attempts = 0

[environment]
# FAIL2BAN_* vars inherited from Docker container environment
# Defaults set in fail2ban-rs-config.toml

[termination]
signal = "TERM"
wait = "5s"
