# fail2ban-rs configuration for dure-mycart + XMPP stack
# Version: 1.5.3+ format

[global]
ban_count_decay = "30d"  # Reset escalation count after 30 quiet days
state_file = "/var/lib/fail2ban-rs/state.bin"
socket_path = "/var/run/fail2ban-rs/fail2ban-rs.sock"

# [logging]
# level = "info"
# format = "logfmt"

# Monitor XMPP authentication failures
[jail.xmpp-auth]
enabled = true
log_path = "/logs/prosody/prosody.log"
date_format = "syslog"
filter = [
    # Match Prosody auth failures from mod_log_auth
    'Failed authentication attempt .* from IP: <HOST>',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true

# Monitor mycart authentication failures
[jail.mycart-auth]
enabled = true
log_path = "/logs/mycart-stderr.log"
date_format = "iso8601"
filter = [
    # Match mycart auth failures - adjust regex based on actual log format
    '"level":"warn".*"status":401.*"ip":"<HOST>"',
    '"level":"error".*authentication.*"ip":"<HOST>"',
]
max_retry = 5
find_time = "10m"
ban_time = "1h"
backend = "nftables"
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
