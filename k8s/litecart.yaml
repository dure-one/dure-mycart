apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mycart-pvc
  namespace: shop
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-sg

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycart
  namespace: shop
spec:
  # Stays at 1 even on PostgreSQL. The database would allow more, but
  # ./lc_certs (autocert) is local to the pod, so TLS would have to be
  # terminated outside the application first.
  replicas: 1
  selector:
    matchLabels:
      app: mycart
  template:
    metadata:
      labels:
        app: mycart
    spec:
      nodeSelector:
        type: sg
      containers:
      - name: mycart
        image: shurco/mycart:latest
        # Database. With these unset myCart uses the embedded SQLite database
        # in /lc_base, which is what an existing installation does. To run on
        # PostgreSQL instead, create the secret once:
        #
        #   kubectl -n shop create secret generic mycart-db \
        #     --from-literal=driver=postgres \
        #     --from-literal=dsn='postgres://mycart:PASSWORD@postgres.shop.svc.cluster.local:5432/mycart?sslmode=disable'
        #
        # and uncomment the block below here *and* in the mycart-install Job:
        # the Job installs the cart, so without the same variables it would
        # install into SQLite while the Deployment serves PostgreSQL.
        #
        # myCart adds timezone=UTC to the connection itself and refuses to
        # start if the session timezone is anything else, so the server's own
        # timezone does not matter.
        #
        # env:
        #   - name: MYCART_DB_DRIVER
        #     valueFrom:
        #       secretKeyRef:
        #         name: mycart-db
        #         key: driver
        #   - name: MYCART_DB_DSN
        #     valueFrom:
        #       secretKeyRef:
        #         name: mycart-db
        #         key: dsn
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: mycart-storage
          mountPath: /lc_base
          subPath: lc_base 
        - name: mycart-storage
          mountPath: /lc_digitals
          subPath: lc_digitals
        - name: mycart-storage
          mountPath: /lc_uploads
          subPath: lc_uploads
        - name: mycart-storage
          mountPath: /site
          subPath: site
      volumes:
      - name: mycart-storage
        persistentVolumeClaim:
          claimName: mycart-pvc

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mycart-ingress
  namespace: shop
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - domain
    secretName: mycart-tls
  rules:
  - host: domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mycart-service
            port:
              number: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: mycart-service
  namespace: shop
spec:
  selector:
    app: mycart
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort

---
apiVersion: batch/v1
kind: Job
metadata:
  name: mycart-install
  namespace: shop
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mycart-install
        image: shurco/mycart:latest
        # Database. With these unset myCart uses the embedded SQLite database
        # in /lc_base, which is what an existing installation does. To run on
        # PostgreSQL instead, create the secret once:
        #
        #   kubectl -n shop create secret generic mycart-db \
        #     --from-literal=driver=postgres \
        #     --from-literal=dsn='postgres://mycart:PASSWORD@postgres.shop.svc.cluster.local:5432/mycart?sslmode=disable'
        #
        # and uncomment the block below here *and* in the mycart-install Job:
        # the Job installs the cart, so without the same variables it would
        # install into SQLite while the Deployment serves PostgreSQL.
        #
        # myCart adds timezone=UTC to the connection itself and refuses to
        # start if the session timezone is anything else, so the server's own
        # timezone does not matter.
        #
        # env:
        #   - name: MYCART_DB_DRIVER
        #     valueFrom:
        #       secretKeyRef:
        #         name: mycart-db
        #         key: driver
        #   - name: MYCART_DB_DSN
        #     valueFrom:
        #       secretKeyRef:
        #         name: mycart-db
        #         key: dsn
        command:
          - /mycart
          - install
          - --email
          - admin@example.com
          - --password
          - ChangeMeNow123
          - --domain
          - domain
        volumeMounts:
        - name: mycart-storage
          mountPath: /lc_base
          subPath: lc_base
        - name: mycart-storage
          mountPath: /lc_digitals
          subPath: lc_digitals
        - name: mycart-storage
          mountPath: /lc_uploads
          subPath: lc_uploads
        - name: mycart-storage
          mountPath: /site
          subPath: site
      volumes:
      - name: mycart-storage
        persistentVolumeClaim:
          claimName: mycart-pvc