version: 2

before:
  hooks:
    # docs/swagger/docs.go is gitignored; generate it so the blank import in
    # cmd/main.go resolves locally. Without this, `go mod tidy` looks the
    # package up on the module proxy and fails with "no matching versions".
    - go install github.com/swaggo/swag/cmd/swag@v1.16.6
    - sh -c '"$(go env GOPATH)/bin/swag" init -g cmd/main.go --output docs/swagger --parseDependency --parseInternal'
    - go mod tidy
    - go mod download
    - sh -c "cd web/admin && bun install --force"
    - sh -c "cd web/admin && bun run build"
    - sh -c "cd web/site && bun install --force"
    - sh -c "cd web/site && bun run build"

builds:
  - env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Releases ship the sqlc query layer (internal/queries/*_sqlc.go).
    tags:
      - sqlc
    ldflags:
      - -s -w
      - -X "main.version=v{{.Version}}"
      - -X "main.gitCommit={{.ShortCommit}}"
      - -X "main.buildDate={{.Now.Format "2006-01-02"}}"
    main: ./cmd
    binary: dure-mycart
    hooks:
      # Fail the release if a binary was built without the sqlc tag. Go records
      # the tags in the binary ("build -tags=sqlc"), for every target platform.
      post:
        - sh -c 'go version -m "{{ .Path }}" | grep -Eq "^[[:space:]]+build[[:space:]]+-tags=([^[:space:]]*,)?sqlc(,|$)" || { echo "{{ .Path }} was not built with -tags sqlc" >&2; exit 1; }'

archives:
  - name_template: '{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - init
      - '^.*?ci:'
      - '^.*?test:'
      - '^.*?build(deps):'
      - '^.*?build:'
      - 'README'
      - 'Up'
      - 'merge conflict'
      - Bump
      - Small fix
      - Update
      - Updating
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: 'Security updates'
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 150
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: 'Documentation updates'
      regexp: ^.*?doc(\([[:word:]]+\))??!?:.+$
      order: 400
    - title: 'Build process updates'
      regexp: ^.*?build(\([[:word:]]+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999

release:
  name_template: "v{{ .Version }}"
  header: |
    > *To update the prebuilt executable you can run `./dure-mycart update`*

  footer: |
    **Full Changelog**: https://github.com/dure-one/dure-mycart/compare/{{ .PreviousTag }}...{{ .Tag }}

    > [!WARNING]
    > If you are updating, it is essential to do the following - back up the **./site** folder if you have made changes to it (you can rename it). A new folder with updated files will be created.

announce:
  mastodon:
    enabled: false
    message_template: "#dure-mycart {{ .Tag }} is out! Check it out: https://github.com/dure-one/dure-mycart/releases/tag/{{ .Tag }}"
    server: https://mastodon.social
