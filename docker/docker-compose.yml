services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.9
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
    restart: always

  acme-companion:
    image: nginxproxy/acme-companion:2.6
    container_name: nginx-proxy-acme
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d:rw
      - html:/usr/share/nginx/html:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - DEFAULT_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    restart: always

  mycart:
    image: ghcr.io/shurco/mycart:latest
    container_name: mycart
    restart: always
    expose:
      - "8080"
    volumes:
      - ./lc_base:/lc_base
      - ./lc_digitals:/lc_digitals
      - ./lc_uploads:/lc_uploads
      - ./site:/site
    environment:
      - VIRTUAL_HOST=${DOMAIN:-yourdomain.com}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${DOMAIN:-yourdomain.com}
      - LETSENCRYPT_EMAIL=${ADMIN_EMAIL:-admin@example.com}

volumes:
  certs:
  vhost:
  html:
  acme:
