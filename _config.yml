# Configuration for Solidebase documentation generator
# Based on https://github.com/nikescar/mdx-sitegen-solidbase

# Site settings
title: myCart
description: Open source shopping-cart backend API - a single-binary e-commerce solution
issue_link: "https://github.com/shurco/mycart/issues"
edit_path: "https://github.com/shurco/mycart/edit/main/:path"
lang: en
site_favicon: './web/admin/public/favicon.ico'
site_author: shurco
repo_url: 'https://github.com/shurco/mycart'
site_url: 'https://shurco.github.io/mycart/'

# Excluded items
exclude:
  - .github
  - .git
  - .gitignore
  - node_modules
  - scripts
  - tmp
  - _config.yml
  - package.json
  - package-lock.json
  - bun.lockb
  - go.mod
  - go.sum
  - web
  - internal
  - pkg
  - cmd
  - migrations
  - reference
  - lc_base
  - lc_uploads
  - lc_digitals
  - lc_certs
  - fixtures
  - .solidbase
  - .output
  - .vinxi
  - AGENTS.md

# Include in processing
include:
  - index.md
  - README.md

# Theme settings
theme_upstream: 'https://github.com/nikescar/mdx-sitegen-solidbase'
theme_config:
  social_links:
    gitHub: 'https://github.com/shurco/mycart'
  nav:
    Docs: /docs
    API: /swagger
    E2E: /e2e
    GitHub: https://github.com/shurco/mycart
  sidebar:
    - Docs:
      - Guide:
          Home: /
          "API Documentation": /swagger
          "E2E Test Reports": /e2e
    - API:
      - API:
          "Swagger UI": /swagger
    - E2E:
      - "Test Reports":
          Admin: /e2e/admin
          Site: /e2e/site

# GitHub Pages deployment
# The workflow handles deployment, so we use --no-deploy flag
# Output will be in .solidbase/.output/public/
