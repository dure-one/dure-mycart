version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema"
    queries: "db/queries/postgres"
    gen:
      go:
        package: "pggen"
        out: "internal/queries_sqlc/sqlc/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true

  - engine: "sqlite"
    schema: "db/schema"
    queries: "db/queries/sqlite"
    gen:
      go:
        package: "sqlitegen"
        out: "internal/queries_sqlc/sqlc/sqlite"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
