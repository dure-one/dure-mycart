name: Deploy All Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - features/goswag
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Setup environments
      - name: Setup Go Environment
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          # Go dependencies
          go mod download

          # Swag CLI
          go install github.com/swaggo/swag/cmd/swag@latest

          # Root dependencies (patchright for e2e tests)
          bun install

          # Frontend dependencies for e2e tests
          cd web/admin && bun install && cd ../..
          cd web/site && bun install && cd ../..

          # Patchright browsers
          bunx patchright install --with-deps chromium

      # 4. Generate Swagger documentation (must run before Go build)
      - name: Generate Swagger Documentation
        run: |
          $(go env GOPATH)/bin/swag init \
            -g cmd/main.go \
            --output docs/swagger \
            --parseDependency \
            --parseInternal

          echo "Swagger docs generated:"
          ls -la docs/swagger/

      # 5. Build application for e2e tests
      - name: Build myCart Binary
        run: |
          # Build frontend SPAs first
          cd web/admin && bun run build && cd ../..
          cd web/site && bun run build && cd ../..

          # Build Go binary (now docs/swagger package exists)
          go build -o mycart ./cmd
          chmod +x mycart

      # 6. Run E2E tests and generate reports
      - name: Run E2E Tests
        run: |
          # Let Patchright manage server lifecycle via webServer config
          npx patchright test --reporter=html
        continue-on-error: true

      # 7. Build VitePress documentation
      - name: Build VitePress Docs
        run: |
          echo "Building VitePress documentation..."
          bun run docs:build

          echo "VitePress build complete. Checking output..."
          if [ ! -d "docs/.vitepress/dist" ]; then
            echo "ERROR: VitePress build failed - no output directory found"
            exit 1
          fi

          echo "VitePress output files:"
          ls -la docs/.vitepress/dist/

      # 8. Prepare unified public directory
      - name: Prepare Public Directory
        run: |
          mkdir -p public

          # Copy VitePress output (main docs site)
          echo "Copying VitePress output..."
          cp -r docs/.vitepress/dist/* public/

          # Copy Swagger docs
          echo "Copying Swagger documentation..."
          mkdir -p public/swagger
          cp -r docs/swagger/* public/swagger/

          # Download and configure Swagger UI
          SWAGGER_UI_VERSION=5.11.0
          echo "Downloading Swagger UI v${SWAGGER_UI_VERSION}..."
          curl -sL https://github.com/swagger-api/swagger-ui/archive/refs/tags/v${SWAGGER_UI_VERSION}.tar.gz | tar -xz
          cp -r swagger-ui-${SWAGGER_UI_VERSION}/dist/* public/swagger/
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./swagger.json|g' public/swagger/swagger-initializer.js

          # Copy E2E reports
          echo "Copying E2E test reports..."
          mkdir -p public/e2e

          if [ -d playwright-report ]; then
            echo "Copying combined Playwright report to public/e2e/..."
            cp -r playwright-report/* public/e2e/
          else
            echo "No Playwright report found, creating placeholder..."
            cat > public/e2e/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>E2E Test Reports</title>
              <style>
                  body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                  h1 { color: #333; }
                  p { line-height: 1.6; }
                  a { color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>E2E Test Reports</h1>
              <p>Playwright end-to-end test results will appear here after tests run successfully.</p>
              <p><a href="/">← Back to Documentation Home</a></p>
          </body>
          </html>
          EOF
          fi

          echo "Public directory structure:"
          find public -type f | head -20

      # 9. Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 10. Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      # 11. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
