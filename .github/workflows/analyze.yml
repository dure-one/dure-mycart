name: "analyze"

on:
  push:
    branches:
      - main
      - test
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '34 10 * * 2'
  workflow_dispatch:

jobs:
  cancel-previous-runs:
    name: Cancel previous runs
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]') && !contains(github.event.commits[0].message, '[ci skip]')"
    steps:
      - uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

  check-changes:
    name: Check file changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          go:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - 'pkg/**'
            - 'internal/**'
            - 'cmd/**'
          web:
            - 'web/admin/**'
            - 'web/site/**'
            - '**/package.json'
            - '**/bun.lockb'

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]') && !contains(github.event.commits[0].message, '[ci skip]')"
    needs: [cancel-previous-runs, check-changes]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript-typescript' ]
        exclude:
          - language: ${{ needs.check-changes.outputs.go != 'true' && 'go' || 'none' }}
          - language: ${{ needs.check-changes.outputs.web != 'true' && 'javascript-typescript' || 'none' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
      if: ${{ matrix.language == 'go' }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.1
      with:
        languages: ${{ matrix.language }}
      timeout-minutes: 10

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4.38.1
      if: ${{ matrix.language != 'go' }}
      timeout-minutes: 30

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.1
      with:
        category: "/language:${{matrix.language}}"