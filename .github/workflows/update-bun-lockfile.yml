name: Update Bun Lockfile

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update lockfiles on'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update web/admin lockfile
        run: |
          cd web/admin
          bun install
          cd ../..

      - name: Update web/site lockfile
        run: |
          cd web/site
          bun install
          cd ../..

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet web/admin/bun.lockb web/site/bun.lockb; then
            echo "No changes to commit"
          else
            git add web/admin/bun.lockb web/site/bun.lockb
            git commit -m "🔧 build(deps): update bun lockfiles

- Update web/admin/bun.lockb
- Update web/site/bun.lockb

Auto-generated by update-bun-lockfile workflow"
            git push origin ${{ inputs.branch }}
            echo "Changes committed and pushed to ${{ inputs.branch }}"
          fi
