name: Update Bun Lockfile

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update web/admin lockfile
        run: |
          cd web/admin
          bun install --frozen-lockfile=false
          cd ../..

      - name: Update web/site lockfile
        run: |
          cd web/site
          bun install --frozen-lockfile=false
          cd ../..

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet web/admin/bun.lockb web/site/bun.lockb; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🔧 build(deps): update bun lockfiles

            - Update web/admin/bun.lockb
            - Update web/site/bun.lockb

            Auto-generated by update-bun-lockfile workflow
          branch: chore/update-bun-lockfile
          delete-branch: true
          title: '🔧 build(deps): update bun lockfiles'
          body: |
            ## Summary
            Automated update of Bun lockfiles to resolve dependency updates.

            ## Changes
            - Updated `web/admin/bun.lockb`
            - Updated `web/site/bun.lockb`

            ## Auto-generated
            This PR was automatically created by the `update-bun-lockfile` workflow.

            🤖 Generated by GitHub Actions
          labels: |
            dependencies
            automated
          assignees: ${{ github.repository_owner }}
