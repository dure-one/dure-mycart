name: Deploy Swagger Docs to GitHub Pages

on:
  push:
    branches:
      - main # Triggers on pushes to main branch
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Needed to push documentation updates to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v7
        with:
          go-version: '1.26' # Match project Go version

      - name: Install Swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger Documentation
        run: |
          swag init -g cmd/main.go --output docs --parseDependency --parseInternal
          echo "Swagger docs generated successfully"
          ls -la docs/

      - name: Prepare Static HTML Directory
        run: |
          mkdir -p public

          # Copy generated swagger files to public distribution folder
          cp -r docs/* public/

          # Download Swagger UI static assets
          SWAGGER_UI_VERSION=5.11.0
          curl -sL https://github.com/swagger-api/swagger-ui/archive/refs/tags/v${SWAGGER_UI_VERSION}.tar.gz | tar -xz

          # Copy Swagger UI dist files
          cp -r swagger-ui-${SWAGGER_UI_VERSION}/dist/* public/

          # Configure Swagger UI to use our generated swagger.json
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./swagger.json|g' public/swagger-initializer.js

          # Verify files are in place
          echo "Public directory contents:"
          ls -la public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: 'docs: update Swagger API documentation'
