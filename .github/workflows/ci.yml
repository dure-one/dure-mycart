name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  go:
    name: Go vet / test / build (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs twice: on the embedded SQLite database, which is what
        # an existing installation uses, and on PostgreSQL, which is what the
        # portability work has to keep working. Both legs run the same tests;
        # only testutil's setup differs.
        db: [sqlite, postgres]
    services:
      # Started for both legs — GitHub cannot make a service conditional — and
      # used by the postgres leg only.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          # The tests provision their own databases with pgtestdb; this one is
          # only the connection it administers the server through, and it has
          # to exist. The user must be able to create databases and roles.
          POSTGRES_DB: mycart_test
          # Deliberately not UTC. myCart stores timestamps without a time
          # zone and the connection pins the session to UTC; on a server whose
          # default is UTC a missing pin would go unnoticed, while here the
          # stored dates shift by nine hours and the suite fails.
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_DRIVER: ${{ matrix.db }}
      # Empty on the sqlite leg: a DSN would make the tests that need a real
      # server run there too.
      TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://postgres:test@localhost:5432/mycart_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Swagger docs (docs/swagger) and the admin/site SPA builds (web/*/build)
      # are git-ignored artifacts; generate them so `go vet`/`go build` compile.
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init \
            -g cmd/main.go \
            --output docs/swagger \
            --parseDependency \
            --parseInternal

      - name: Build frontends (embedded via go:embed)
        run: |
          for app in admin site; do
            (cd web/$app && bun install && bun run build)
          done

          # Only commit lockfiles once (sqlite leg of go job only)
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web/*/bun.lockb || true
            if ! git diff --staged --quiet 2>/dev/null; then
              git commit -m "chore: regenerate bun lockfiles [skip ci]"
              git push || echo "Push failed (race condition), ignoring"
            fi
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      # Timestamps are stored without a time zone and read back as unix
      # seconds, so the process timezone must not reach the data. Running the
      # suite once under a non-UTC zone is what proves it.
      - name: Test (TZ=Asia/Seoul)
        env:
          TZ: Asia/Seoul
        run: go test ./internal/... ./pkg/... -count=1

      - name: Build
        run: go build ./...

  go-sqlc:
    name: Go sqlc backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mycart_test
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_DRIVER: ${{ matrix.db }}
      TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://postgres:test@localhost:5432/mycart_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0

      - name: Generate sqlc code
        run: $(go env GOPATH)/bin/sqlc generate

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init \
            -g cmd/main.go \
            --output docs/swagger \
            --parseDependency \
            --parseInternal

      - name: Build frontends (embedded via go:embed)
        run: |
          for app in admin site; do
            (cd web/$app && bun install && bun run build)
          done

      - name: Vet (sqlc backend)
        run: go vet -tags sqlc ./...

      - name: Test (sqlc backend)
        run: go test -tags sqlc ./... -count=1 -race

      - name: Test (TZ=Asia/Seoul, sqlc backend)
        env:
          TZ: Asia/Seoul
        run: go test -tags sqlc ./internal/... ./pkg/... -count=1

      - name: Build (sqlc backend)
        run: go build -tags sqlc -o mycart-sqlc ./cmd

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, site]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web/${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: web/${{ matrix.app }}
        run: bun run build

      # Non-blocking for now: the apps have ~50 pre-existing type findings.
      # Flip continue-on-error to false once `bun run check` is clean.
      - name: Type check (svelte-check)
        working-directory: web/${{ matrix.app }}
        run: bun run check
        continue-on-error: true
