    interval: weekly
  open-pull-requests-limit: 2
  commit-message:
    prefix: "🔧 build"
    include: "scope"

- package-ecosystem: "npm"
  directory: "/web/site"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  commit-message:
    prefix: "🔧 build"
    include: "scope"

- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: "🔧 build"
    include: "scope"
