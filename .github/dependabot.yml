version: 2
updates:
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  commit-message:
    prefix: "🔧 build"
    include: "scope"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: "🔧 build"
    include: "scope"

- package-ecosystem: "npm"
  directory: "/web/admin"
